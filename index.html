            box-sizing: border-box;

        }

            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .header {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            padding: 25px 20px;
            text-align: center;
            border-radius: 25px 25px 0 0;
            color: white;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            font-size: 0.95rem;
            opacity: 0.9;
        }
        
        .intro-section {
            padding: 30px 25px;
            text-align: center;
        }
        
        .intro-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #444;
        }
        
        .highlight {
            color: #6a11cb;
            font-weight: 600;
        }
        
        .emoji-large {
            font-size: 3rem;
            margin: 15px 0;
            display: block;
        }
        
        .start-btn {
            background: linear-gradient(90deg, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px auto;
            width: 100%;
            max-width: 280px;
        }
        
        .start-btn:active {
            transform: scale(0.95);
        }
        
        .meme-section {
            display: none;
            padding: 20px;
            text-align: center;
            min-height: 450px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .meme-container {
            width: 100%;
            max-width: 280px;
            height: 280px;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            background-color: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #e9ecef;
        }
        
        .meme-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 15px;
            display: none;
            animation: popIn 0.5s ease forwards;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .meme-placeholder {
            text-align: center;
            color: #888;
            padding: 30px 20px;
        }
        
        .meme-placeholder i {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: #ccc;
        }
        
        .meme-title {
            font-size: 1.3rem;
            color: #333;
            font-weight: 600;
            margin: 15px 0 8px;
            min-height: 30px;
        }
        
        .memo-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 20px;
        }
        
        .tag {
            background: #e9ecef;
            color: #495057;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }
        
        .generate-btn {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(106, 17, 203, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .generate-btn:active {
            transform: scale(0.98);
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        
        .action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        .save-btn {
            background: #20c997;
            color: white;
        }
        
        .back-btn {
            background: #6c757d;
            color: white;
        }
        
        .share-btn {
            background: #2575fc;
            color: white;
        }
        
        .counter {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 50px;
            margin-top: 10px;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);

            background: #ff6b6b;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;

        footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            padding: 0 15px;
            max-width: 500px;
        }

            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
        }
        
        .meme-list h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #333;
        }
        
        .meme-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .meme-thumb {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .meme-thumb:hover {
            border-color: #6a11cb;
            transform: scale(1.05);
        }
        
        .meme-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

            body {

            }

                border-radius: 20px;
            }

            }
            
            .meme-container {
                height: 250px;
            }
            
            .meme-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

        // 初始化

            // 更新计数器显示

            memeCountElement.textContent = allMemes.length;
            
            // 生成缩略图网格

            // 如果URL中有参数，直接进入表情包页面
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auto') === 'true') {
                showMemeSection();
                setTimeout(() => {
                    generateMeme();
                }, 300);
            }
        }

        // 生成缩略图网格
        function generateThumbnails() {
            memeGrid.innerHTML = '';
            
            allMemes.forEach((meme, index) => {
                const thumb = document.createElement('div');
                thumb.className = 'meme-thumb';
                thumb.innerHTML = `<img src="${meme.base64}" alt="${meme.title}">`;
                
                thumb.addEventListener('click', () => {
                    showSpecificMeme(index);
                    memeList.style.display = 'none';
                });
                
                memeGrid.appendChild(thumb);
            });
        }

            introSection.style.display = 'none';
            memeSection.style.display = 'flex';

        }

        function showMemeList() {
            memeSection.style.display = 'none';
            memeList.style.display = 'block';

        }

        function showIntroSection() {
            memeSection.style.display = 'none';
            memeList.style.display = 'none';

        // 生成随机表情包
        function generateMeme() {
            // 随机选择一个表情包
            currentMemeIndex = Math.floor(Math.random() * allMemes.length);
            const meme = allMemes[currentMemeIndex];
            
            displayMeme(meme);
            
            // 更新计数器
            displayCounter++;
            counterElement.textContent = displayCounter;
        }

        // 显示特定表情包
        function showSpecificMeme(index) {
            currentMemeIndex = index;
            const meme = allMemes[index];
            
            displayMeme(meme);
            
            // 切换到表情包显示界面
            showMemeSection();
            
            // 更新计数器
            displayCounter++;
            counterElement.textContent = displayCounter;
        }

        // 显示表情包
        function displayMeme(meme) {
            // 隐藏占位符，显示图片
            memePlaceholder.style.display = 'none';
            memeImage.style.display = 'block';
            
            // 设置图片
            memeImage.src = meme.url || meme.base64;
            
            // 设置标题
            memeTitle.textContent = meme.title;
            
            // 设置标签
            memoTags.innerHTML = '';
            meme.tags.forEach(tag => {
                const tagElement = document.createElement('span');
                tagElement.className = 'tag';
                tagElement.textContent = tag;
                memoTags.appendChild(tagElement);
            });
        }

        // 保存表情包
        function saveMeme() {
            if (!allMemes[currentMemeIndex]) return;
            
            const meme = allMemes[currentMemeIndex];
            
            // 创建下载链接
            const link = document.createElement('a');
            link.href = meme.base64;
            link.download = `表情包_${meme.title}_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // 显示保存成功提示
            saveBtn.innerHTML = '<i class="fas fa-check"></i> 已保存';
            setTimeout(() => {
                saveBtn.innerHTML = '<i class="fas fa-save"></i> 保存';
            }, 1500);
        }

        // 分享页面
        function sharePage() {
            const shareText = `我发现了一个超棒的表情包生成器，里面有${allMemes.length}个精选表情包！`;
            const shareUrl = window.location.href.includes('?') 
                ? `${window.location.origin}${window.location.pathname}?auto=true`
                : `${window.location.href}?auto=true`;
            
            // 使用Web Share API（如果可用）
            if (navigator.share) {
                navigator.share({
                    title: '表情包生成器',
                    text: shareText,
                    url: shareUrl,
                });
            } else {
                // 备用分享方案
                const shareMessage = `${shareText}\n\n点击链接直接使用：${shareUrl}`;
                
                // 尝试复制到剪贴板
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareMessage).then(() => {
                        alert('分享链接已复制到剪贴板！\n\n您可以将链接发送给好友。');
                    }).catch(() => {
                        prompt('请复制以下链接分享给好友：', shareUrl);
                    });
                } else {
                    prompt('请复制以下链接分享给好友：', shareUrl);
                }
            }
        }

        // 事件监听
        startBtn.addEventListener('click', showMemeSection);
        generateBtn.addEventListener('click', generateMeme);
        backBtn.addEventListener('click', showMemeList);
        saveBtn.addEventListener('click', saveMeme);
        shareBtn.addEventListener('click', sharePage);
        closeListBtn.addEventListener('click', showMemeSection);

        // 初始化页面
        window.addEventListener('load', init);
    </script>
</body>

</html>
